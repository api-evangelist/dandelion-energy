name: Dandelion Energy
description: 'Dandelion Energy is a residential geothermal heating and cooling company
  that designs, engineers, and installs ground-source heat pump systems for homeowners
  and new-home builders. Its systems tap the earth''s stable subsurface temperature
  to heat and cool homes year-round, cutting utility bills and carbon emissions versus
  conventional fossil-fuel HVAC. Dandelion delivers end-to-end service from ground-loop
  drilling through turnkey installation, and offers a leasing program that removes
  the upfront cost for buyers. The company reports thousands of installations across
  the United States. Backed by GV (Google Ventures), it operates in the frontier-tech
  and climate sector; it currently exposes no public developer API.'
